name: Jarvis offline tests

on:
  push:
    branches: [main, "improve/**"]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile application modules
        run: python -m compileall -q jarvis
